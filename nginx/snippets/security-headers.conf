# Security headers, shared by every place that sets its own add_header.
#
# nginx rule: as soon as a location uses add_header, it no longer inherits
# ANY add_header from the server block. So every such location has to include
# this file again, otherwise it answers without CSP, X-Frame-Options and so on.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (Next.js compatible).
# 'unsafe-inline' is needed for the Next.js hydration scripts and the inline
# accent colour style. TODO: replace by a nonce-based policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Restrict browser features
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
