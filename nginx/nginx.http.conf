# InterCat Lynx - nginx WITHOUT HTTPS.
#
# For a first test, or when another proxy in front terminates TLS (a company
# reverse proxy, Cloudflare, a load balancer). Everything except the TLS part
# is identical to nginx.conf; tests/test_nginx_configs.py checks that the two
# files do not drift apart.
#
# If this nginx is reached directly from the internet, use nginx.conf (HTTPS).
# Select the file with NGINX_CONF in .env.
#
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript;
    gzip_min_length 1000;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=stats:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Cache
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # Never cache a response for a request that carries credentials. nginx's
    # cache key is only the URL, so without this the answer for one user
    # (/api/v1/auth/me, the watchlist feed, ...) is handed to the next visitor
    # asking for the same URL, and the setup assistant polls stale status. Found
    # in the first Docker test. $skip_cache is 1 whenever one of these headers
    # is present; the cached locations below bypass and skip storing then.
    map "$http_authorization$http_x_setup_token$http_x_api_key$http_cookie" $skip_cache {
        ""      0;
        default 1;
    }

    # Client address: every proxy_set_header X-Forwarded-For below REPLACES the
    # header with $remote_addr instead of appending to what the client sent.
    # The backend (TRUSTED_PROXIES=1) relies on that. If this nginx sits behind
    # another proxy (Cloudflare, load balancer), add the real_ip module here:
    #   set_real_ip_from <proxy network>;  real_ip_header X-Forwarded-For;
    # and set TRUSTED_PROXIES accordingly, see .env.example.

    # Upstream Backend
    upstream backend {
        least_conn;
        server backend:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream Frontend
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # Plain HTTP server (see the note at the top of this file)
    server {
        listen 80;
        server_name _;

        # Security headers (one shared file, see nginx/snippets/)
        include /etc/nginx/snippets/security-headers.conf;

        # Connection limit. Over HTTP/2 every concurrent stream counts as a
        # connection and Next.js loads many chunks in parallel, so 10 caused
        # 503s on /_next/static (upstream issue #45). Request rate limiting
        # (limit_req) stays the main protection; answer with 429, not 503.
        limit_conn addr 100;
        limit_conn_status 429;

        # Health Check (no rate limit)
        location ~ ^/health(/live|/ready)?$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # API Endpoints
        location /api/v1/vulnerabilities {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache GET requests
            proxy_cache api_cache;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 2m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Search Endpoint (stricter limit)
        location /api/v1/search {
            limit_req zone=search burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache search results
            proxy_cache api_cache;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_valid 200 1m;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Stats Endpoint (very strict, heavy caching)
        location /api/v1/stats {
            limit_req zone=stats burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;

            # Aggressive caching
            proxy_cache api_cache;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            include /etc/nginx/snippets/security-headers.conf;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Comments Endpoints (NO caching for dynamic content)
        location ~ ^/api/v1/(vulnerabilities/[^/]+/comments|comments) {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # NO CACHING for comments (dynamic content)
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Other API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # NO caching here: this location holds everything personal (login,
            # profile, watchlist, notifications, admin, setup assistant, Zabbix
            # tokens). Only the public locations above are cached.
        }

        # Metrics are for Prometheus only. It reads them straight from the backend
        # inside the Docker network, so the public side does not need them.
        location = /metrics {
            return 404;
        }

        # /health/detailed shows system data and stays internal as well
        location = /health/detailed {
            return 404;
        }

        # Frontend - Next.js
        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files (aggressive caching)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 1y;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://frontend;
            expires 1y;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom error pages
        error_page 429 /429.html;
        location = /429.html {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After 30 always;
            default_type text/html;
            charset utf-8;
            return 429 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zu viele Anfragen</title><style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;color:#1f2937;line-height:1.5}h1{font-size:1.4rem}p{color:#4b5563}</style></head><body><h1>Zu viele Anfragen</h1><p>Von dieser Adresse kamen gerade sehr viele Anfragen. Bitte kurz warten und dann neu laden.</p><p lang="en">Too many requests. Please wait a moment and reload.</p></body></html>';
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            default_type text/html;
            charset utf-8;
            # Shown while the backend restarts (update, rolling restart). The page
            # reloads itself every 10 seconds, so nobody has to press F5.
            return 503 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="10"><title>Kurz nicht erreichbar</title><style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;color:#1f2937;line-height:1.5}h1{font-size:1.4rem}p{color:#4b5563}</style></head><body><h1>Gleich geht es weiter</h1><p>Der Dienst startet gerade neu, zum Beispiel nach einem Update. Diese Seite lädt sich alle 10 Sekunden von selbst neu.</p><p>Dauert es länger als zwei Minuten, hilft ein Blick in <code>docker compose ps</code> und <code>docker compose logs backend</code>.</p><p lang="en">The service is restarting. This page reloads itself every 10 seconds.</p></body></html>';
        }
    }
}
