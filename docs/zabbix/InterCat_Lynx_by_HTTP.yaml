        - uuid: bb6fd8e4a3114501a91b1d9ec0eef412
          name: 'Lynx: Highest CVSS score (7d)'
          type: DEPENDENT
          key: lynx.max_cvss_7d
          delay: '0'
          history: 30d
          trends: 365d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.max_cvss_7d
          master_item:
            key: lynx.summary
          tags:
            - tag: component
              value: cve
      discovery_rules:
        - uuid: c35d66a9d3974cc9ae16358f05fc42ae
          name: 'Lynx: followed products'
          type: HTTP_AGENT
          key: lynx.products.discovery
          delay: 1h
          url: '{$LYNX.URL}/api/v1/zabbix/discovery'
          headers:
            - name: Authorization
              value: 'Bearer {$LYNX.TOKEN}'
          item_prototypes:
            - uuid: c147080483e242a1a5988a5e6f5dd220
              name: 'Lynx {#LABEL}: New CVEs (24h)'
              type: DEPENDENT
              key: 'lynx.product.new_24h[{#KEY}]'
              delay: '0'
              history: 30d
              trends: 365d
              value_type: UNSIGNED
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.items[?(@.key=="{#KEY}")].new_24h.first()'
              master_item:
                key: lynx.products
              tags:
                - tag: product
                  value: '{#LABEL}'
            - uuid: 57bee98938df47449820f1c35d8f6ebf
              name: 'Lynx {#LABEL}: Critical CVEs (24h)'
              type: DEPENDENT
              key: 'lynx.product.critical_24h[{#KEY}]'
