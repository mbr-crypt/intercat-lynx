                  value: '{#LABEL}'
            - uuid: 7393a23f81684de6b828d676437dc9c6
              name: 'Lynx {#LABEL}: Highest CVSS score (7d)'
              type: DEPENDENT
              key: 'lynx.product.max_cvss_7d[{#KEY}]'
              delay: '0'
              history: 30d
              trends: 365d
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.items[?(@.key=="{#KEY}")].max_cvss_7d.first()'
              master_item:
