              master_item:
                key: lynx.products
              tags:
                - tag: product
                  value: '{#LABEL}'
            - uuid: 90cb4a3aea9843dc9a93a729190ba3f3
              name: 'Lynx {#LABEL}: New CVEs (7d)'
              type: DEPENDENT
              key: 'lynx.product.new_7d[{#KEY}]'
              delay: '0'
              history: 30d
