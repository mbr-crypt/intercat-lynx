zabbix_export:
  version: '6.0'
  date: '2026-10-23T12:00:00Z'
  groups:
    - uuid: 153e44051b914b67a3a21f07566bd865
      name: Templates/Applications
  templates:
    - uuid: 7e70677e68bf49aaa08598d2f1f88994
      template: 'InterCat Lynx by HTTP'
      name: 'InterCat Lynx by HTTP'
      description: |
        CVEs for the products followed in InterCat Lynx (https://github.com/mbr-crypt/intercat-lynx).
        Needs a read-only Lynx API token. Set the macros {$LYNX.URL} and {$LYNX.TOKEN} on the host.
        Written by hand and not yet imported into a live Zabbix: check the import result.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 5c6108db33f1420b9f40f21196619852
          name: 'Lynx: summary (raw)'
          type: HTTP_AGENT
          key: lynx.summary
          delay: '{$LYNX.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Counters for all followed products, as JSON. Source for the dependent items.'
          url: '{$LYNX.URL}/api/v1/zabbix/summary'
          headers:
            - name: Authorization
              value: 'Bearer {$LYNX.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: 066287fa3cda429f89b7ed1549758c13
          name: 'Lynx: products (raw)'
          type: HTTP_AGENT
          key: lynx.products
          delay: '{$LYNX.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Counters per followed product, as JSON. Source for the item prototypes.'
          url: '{$LYNX.URL}/api/v1/zabbix/products'
          headers:
            - name: Authorization
              value: 'Bearer {$LYNX.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: 4fb6a08daf9848d0a78f7f0166e949f0
          name: 'Lynx: New CVEs (24h)'
          type: DEPENDENT
          key: lynx.new_24h
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.new_24h
          master_item:
            key: lynx.summary
          tags:
            - tag: component
              value: cve
        - uuid: 00047528237f4f8c846fdf59d29a911d
          name: 'Lynx: Critical CVEs (24h)'
          type: DEPENDENT
          key: lynx.critical_24h
