                  value: '{#LABEL}'
          trigger_prototypes:
            - uuid: 5f90a105f806496aaba6bc7ec6f4f609
              expression: 'last(/InterCat Lynx by HTTP/lynx.product.critical_24h[{#KEY}])>0'
              name: 'Lynx {#LABEL}: new critical CVE in the last 24h'
              priority: HIGH
              description: 'A critical CVE for this product was published in the last 24 hours.'
            - uuid: e4702d902da04939987c36941ccfa4b4
              expression: 'last(/InterCat Lynx by HTTP/lynx.product.exploited_7d[{#KEY}])>0'
              name: 'Lynx {#LABEL}: actively exploited CVE in the last 7 days'
              priority: HIGH
              description: 'A CVE for this product is on the CISA list of actively exploited vulnerabilities.'
      triggers:
        - uuid: 8b261f95c5344b47aa628f790679a054
          expression: 'last(/InterCat Lynx by HTTP/lynx.critical_24h)>0'
          name: 'Lynx: new critical CVE for followed products'
          priority: AVERAGE
          description: 'At least one critical CVE for a followed product was published in the last 24 hours.'
        - uuid: 8e173dcbd0dc4df290a7b845d17b2e46
          expression: 'last(/InterCat Lynx by HTTP/lynx.exploited_24h)>0'
          name: 'Lynx: actively exploited CVE for followed products'
          priority: HIGH
          description: 'At least one CVE for a followed product is actively exploited and was published in the last 24 hours.'
        - uuid: 5cc6e56fb0e944aa973f0f53dc2be4db
          expression: 'nodata(/InterCat Lynx by HTTP/lynx.summary,30m)=1'
          name: 'Lynx: no data for 30 minutes'
          priority: WARNING
          description: 'Lynx did not answer. Check the URL, the token and whether Lynx is running.'
      macros:
        - macro: '{$LYNX.INTERVAL}'
          value: 5m
          description: How often Zabbix asks Lynx.
        - macro: '{$LYNX.TOKEN}'
          type: SECRET_TEXT
          description: Read-only Lynx API token (starts with lynx_).
        - macro: '{$LYNX.URL}'
          value: 'https://lynx.example.org'
          description: Base address of Lynx, without a trailing slash.
