# InterCat Lynx - production-like stack (nginx, frontend, backend, worker, database).
#
# Start:   ./scripts/init-env.sh      (once: creates .env with random secrets)
#          docker compose up -d --build
# Then:    open the address of this server in the browser. The setup assistant asks
#          for the setup token, which is stored in .env (SETUP_TOKEN).
#
# For development (only database and Redis in Docker) use docker-compose.dev.yml.

# Settings every backend process needs. The API server AND the Celery worker use
# them: the worker sends the e-mails and webhooks and has to decrypt the stored
# SMTP password and webhook secrets (that needs SECRET_KEY). A worker without
# these variables silently cannot deliver notifications.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-openthreat}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run ./scripts/init-env.sh or copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-openthreat}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is missing - run ./scripts/init-env.sh or copy .env.example to .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
  NVD_API_KEY: ${NVD_API_KEY:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-}
  LLM_MODEL: ${LLM_MODEL:-}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-InterCat Lynx}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # nginx.http.conf = without HTTPS (first test, TLS done by another proxy)
      # nginx.conf      = with HTTPS, needs nginx/ssl/nginx.crt and nginx.key
      - ${NGINX_CONF:-./nginx/nginx.http.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openthreat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty = the browser talks to the address it loaded the page from
        # (nginx forwards /api). Only set it if the API lives somewhere else.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      - NODE_ENV=production
      # Server-side rendering reaches the backend inside the Docker network
      - API_URL=http://backend:8001
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      <<: *backend-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_URL:-http://localhost}}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}
      RATE_LIMIT_WHITELIST: ${RATE_LIMIT_WHITELIST:-}
      # nginx is the only proxy in front of the backend; it sets X-Forwarded-For
      # to the real client address. Do NOT publish port 8001 while this is on.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Setup assistant: the token asked for on first start (see .env)
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # - ollama  # Uncomment if using Ollama for LLM features
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      replicas: ${BACKEND_REPLICAS:-2}

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openthreat}
      - POSTGRES_USER=${POSTGRES_USER:-openthreat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - run ./scripts/init-env.sh or copy .env.example to .env}
    # SECURITY: Port NOT exposed to host - only accessible within Docker network.
    # For admin tasks: docker compose exec postgres psql -U openthreat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openthreat} -d ${POSTGRES_DB:-openthreat}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    # SECURITY: Port NOT exposed to host - only accessible within Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=1
    environment:
      <<: *backend-env
    depends_on:
      # the backend creates and upgrades the database schema when it starts
      backend:
        condition: service_healthy
      # - ollama  # Uncomment if using Ollama for LLM features
    restart: unless-stopped
    networks:
      - openthreat-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
      replicas: ${WORKER_REPLICAS:-1}

  # Exactly one scheduler, never scale this service
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openthreat-network
    # The image check asks the API port, which does not exist in this container.
    # A scheduler has no useful probe; "restart: unless-stopped" revives it.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Ollama service - uncomment if you want to use local LLM features
  # Requires ~4GB RAM and ~2GB disk space for the image
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=4
  #     - OLLAMA_MAX_LOADED_MODELS=1
  #   restart: unless-stopped
  #   networks:
  #     - openthreat-network
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2.0'
  #         memory: 4G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  openthreat-network:
    driver: bridge
